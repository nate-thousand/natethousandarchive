<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Lab API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1814;
      --muted: #6b6560;
      --paper: #f7f3ec;
      --wash: #ebe4d8;
      --line: #d4ccc0;
      --accent: #c45c26;
      --accent-deep: #9a3f14;
      --ok: #2f6b4f;
      --err: #a33b2c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #fff8ee 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e8ddd0 0%, transparent 50%),
        linear-gradient(180deg, var(--paper), var(--wash));
    }

    .wrap {
      width: min(920px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3.5rem 0 4rem;
    }

    header {
      margin-bottom: 2.25rem;
      animation: rise 0.7s ease both;
    }

    .brand {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .brand em {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      margin-top: 0.75rem;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .panel {
      display: grid;
      gap: 0.85rem;
      margin-bottom: 1.75rem;
      animation: rise 0.7s ease 0.08s both;
    }

    textarea {
      width: 100%;
      min-height: 7.5rem;
      resize: vertical;
      padding: 1rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font: inherit;
      font-size: 1.05rem;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196, 92, 38, 0.15);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    select, button {
      font: inherit;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0.7rem 1.15rem;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent-deep);
      background: var(--accent);
      color: #fff;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-deep);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      min-height: 1.4rem;
      color: var(--muted);
      font-size: 0.95rem;
      animation: rise 0.7s ease 0.12s both;
    }

    .status.error { color: var(--err); }
    .status.ok { color: var(--ok); }

    .gallery {
      display: grid;
      gap: 1.25rem;
      animation: rise 0.7s ease 0.16s both;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 18px 40px rgba(26, 24, 20, 0.06);
      animation: pop 0.45s ease both;
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: var(--wash);
    }

    .meta {
      padding: 1rem 1.15rem 1.2rem;
    }

    .meta p {
      color: var(--ink);
      line-height: 1.45;
    }

    .meta small {
      display: block;
      margin-top: 0.45rem;
      color: var(--muted);
    }

    .empty {
      padding: 2.5rem 1rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
    }

    code {
      font-size: 0.9em;
      background: rgba(255, 255, 255, 0.7);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.98) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (max-width: 560px) {
      .wrap { padding-top: 2rem; }
      .row { flex-direction: column; align-items: stretch; }
      select, button { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">Image <em>Lab</em> API</h1>
      <p class="lede">Local OpenAI image endpoint for any app. Demo UI below — or <code>POST /api/generate</code> with <code>{ prompt, aspect_ratio }</code>.</p>
    </header>

    <div class="panel">
      <textarea id="prompt" placeholder="A mossy greenhouse at dusk, glass fogged with rain, warm tungsten lamps…"></textarea>
      <div class="row">
        <select id="aspect" aria-label="Aspect ratio">
          <option value="1:1">Square 1:1</option>
          <option value="16:9" selected>Landscape 16:9</option>
          <option value="9:16">Portrait 9:16</option>
        </select>
        <button class="primary" id="generate" type="button">Generate image</button>
      </div>
    </div>

    <p class="status" id="status">Checking server…</p>
    <div class="gallery" id="gallery">
      <div class="empty">Generated images will land here.</div>
    </div>
  </div>

  <script>
    const promptEl = document.getElementById('prompt');
    const aspectEl = document.getElementById('aspect');
    const generateBtn = document.getElementById('generate');
    const statusEl = document.getElementById('status');
    const galleryEl = document.getElementById('gallery');
    let empty = true;

    function setStatus(message, kind = '') {
      statusEl.textContent = message;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        if (!data.hasKey) {
          setStatus('Server is up, but OPENAI_API_KEY is missing. Add it to .env and restart.', 'error');
          return;
        }
        setStatus('Ready.', 'ok');
      } catch {
        setStatus('Could not reach the local server. Run npm start in this folder.', 'error');
      }
    }

    function prependResult({ image, prompt, revised_prompt, size }) {
      if (empty) {
        galleryEl.innerHTML = '';
        empty = false;
      }

      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <img src="${image}" alt="${prompt.replace(/"/g, '&quot;')}" />
        <div class="meta">
          <p>${prompt}</p>
          <small>${size}${revised_prompt ? ' · revised by model' : ''}</small>
        </div>
      `;
      galleryEl.prepend(card);
    }

    async function generate() {
      const prompt = promptEl.value.trim();
      if (!prompt) {
        setStatus('Enter a prompt first.', 'error');
        promptEl.focus();
        return;
      }

      generateBtn.disabled = true;
      setStatus('Generating… this usually takes a few seconds.');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt,
            aspect_ratio: aspectEl.value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.details || data.error || 'Generation failed');
        }

        prependResult(data);
        setStatus('Done.', 'ok');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    promptEl.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') generate();
    });

    checkHealth();
  </script>
</body>
</html>
