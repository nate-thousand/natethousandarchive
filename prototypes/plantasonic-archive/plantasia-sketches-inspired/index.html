<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plantasia — Responsive Touch &amp; MIDI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.01, user-scalable=no" />
  <meta name="description" content="Plant-inspired generative synth inspired by Mort Garson's Plantasia. Touch controls, MIDI mapping, and live waveform visualization." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3IDhpRTl5bYT10iB8/vXvz4i7//IN/J9slAg8fbstDw=="
        crossorigin="anonymous">
  <link href="../plantasia-sketches/foundation/bootstrap/CUSTOM.css" rel="stylesheet">
  <link href="../plantasia-sketches/plantasia-app.css" rel="stylesheet">
</head>
<body class="plantasia-app">

<header class="plantasia-header">
  <a class="plantasia-header__back" href="../plantasia-sketches/project-list.html" aria-label="Back to project versions">&larr; Versions</a>
  <h1 class="plantasia-header__title">Plantasia</h1>
  <div class="plantasia-header__status" aria-live="polite" aria-atomic="true">
    <span class="plantasia-header__status-dot" id="statusDot" aria-hidden="true"></span>
    <span id="playStatus">Stopped</span>
  </div>
</header>

<main class="plantasia-stage" aria-label="Waveform visualization">
  <canvas id="waveCanvas" role="img" aria-label="Live audio waveform"></canvas>
  <div id="infoDisplay" role="status" aria-label="Parameter readout"></div>
  <div id="midiLegend" aria-hidden="true"></div>
  <button id="toggleLegend" class="btn btn-sm btn-outline-light" type="button" aria-label="Show or hide MIDI legend" aria-expanded="false">MIDI</button>
</main>

<footer class="plantasia-controls" id="touchUI" aria-label="Synth controls">
  <button class="btn btn-sm btn-outline-light plantasia-controls-toggle" type="button"
          id="toggleControls" aria-expanded="true" aria-controls="controlsBody">
    Hide Controls
  </button>

  <div class="plantasia-controls__body" id="controlsBody">
    <div class="plantasia-controls__grid">

      <div class="plantasia-control plantasia-control--wide">
        <div class="plantasia-preset-swatch" id="presetSwatch" aria-hidden="true"></div>
        <label class="form-label" for="preset">Preset</label>
        <select class="form-select form-select-sm" id="preset" aria-label="Preset">
          <option value="plants">Plants</option>
          <option value="mold">Mold</option>
          <option value="bacteria">Bacteria</option>
          <option value="mushrooms">Mushrooms</option>
          <option value="harmony">Lifeform Harmony</option>
        </select>
      </div>

      <div class="plantasia-control">
        <div class="plantasia-control__label-row">
          <label class="form-label mb-0" for="delay">Delay</label>
          <span class="plantasia-control__value" id="delayValue">0.6</span>
        </div>
        <input class="form-range" type="range" id="delay" min="0.01" max="2.0" step="0.01" value="0.6" aria-label="Delay" />
      </div>

      <div class="plantasia-control">
        <div class="plantasia-control__label-row">
          <label class="form-label mb-0" for="echo">Echo</label>
          <span class="plantasia-control__value" id="echoValue">0.4</span>
        </div>
        <input class="form-range" type="range" id="echo" min="0" max="1.0" step="0.01" value="0.4" aria-label="Echo" />
      </div>

      <div class="plantasia-control">
        <div class="plantasia-control__label-row">
          <label class="form-label mb-0" for="filter">Filter</label>
          <span class="plantasia-control__value" id="filterValue">1200</span>
        </div>
        <input class="form-range" type="range" id="filter" min="100" max="8000" step="10" value="1200" aria-label="Filter" />
      </div>

      <div class="plantasia-control">
        <div class="plantasia-control__label-row">
          <label class="form-label mb-0" for="freq">Frequency</label>
          <span class="plantasia-control__value" id="freqValue">174</span>
        </div>
        <input class="form-range" type="range" id="freq" min="50" max="1000" step="1" value="174" aria-label="Frequency solo" />
      </div>

      <div class="plantasia-control">
        <div class="plantasia-control__label-row">
          <label class="form-label mb-0" for="volume">Volume</label>
          <span class="plantasia-control__value" id="volumeValue">60</span>
        </div>
        <input class="form-range" type="range" id="volume" min="0" max="100" value="60" aria-label="Volume" />
      </div>

      <div class="plantasia-control">
        <div class="plantasia-control__label-row">
          <label class="form-label mb-0" for="bpm">BPM</label>
          <span class="plantasia-control__value" id="bpmValue">90</span>
        </div>
        <input class="form-range" type="range" id="bpm" min="40" max="180" value="90" aria-label="BPM" />
      </div>

      <div class="plantasia-control">
        <label class="form-label" for="midiChannelSelect">MIDI Ch</label>
        <select class="form-select form-select-sm" id="midiChannelSelect" aria-label="MIDI Channel">
          <option value="-1">All</option>
          <option value="0">1 (Default)</option>
          <option value="1">2</option>
          <option value="2">3</option>
          <option value="3">4</option>
          <option value="4">5</option>
          <option value="5">6</option>
          <option value="6">7</option>
          <option value="7">8</option>
          <option value="8">9</option>
          <option value="9">10 (Drums)</option>
          <option value="10">11</option>
          <option value="11">12</option>
          <option value="12">13</option>
          <option value="13">14</option>
          <option value="14">15</option>
          <option value="15">16</option>
        </select>
      </div>

      <div class="plantasia-control">
        <div class="plantasia-control__label-row">
          <label class="form-label mb-0" for="colorSlider">2nd Color</label>
          <span class="plantasia-control__value" id="colorValue">180&deg;</span>
        </div>
        <input class="form-range" type="range" id="colorSlider" min="0" max="359" value="180" aria-label="Secondary color hue" />
      </div>

      <div class="plantasia-transport">
        <button class="btn btn-primary" id="play" type="button" aria-label="Play">Play</button>
        <button class="btn btn-outline-danger" id="stop" type="button" aria-label="Stop">Stop</button>
      </div>

      <div class="plantasia-actions">
        <button class="btn btn-sm btn-outline-light" id="toggleDisplay" type="button" aria-label="Show or hide data panel" aria-pressed="false">Data</button>
        <button class="btn btn-sm btn-outline-light" id="toggleMidiIn" type="button" aria-label="Toggle MIDI input" aria-pressed="true">MIDI: On</button>
      </div>

    </div>
  </div>
</footer>

<script>
let midiChannel = 9;
const MIDI_DEFAULT_CHANNEL = 9;
let midiAccess = null, midiOutput = null, midiInEnabled = true;
let midiTouchLock = false;

function midiNoteToFreq(note) {
  return 440 * Math.pow(2, (note - 69) / 12);
}
const midiLegendData = [
  {btn:1,n:36, action:'Play 1st note'},
  {btn:2,n:37, action:'Play 2nd note'},
  {btn:3,n:38, action:'Play 3rd note'},
  {btn:4,n:39, action:'Play 4th note'},
  {btn:5,n:40, action:'Play 5th note'},
  {btn:6,n:41, action:'Next preset'},
  {btn:7,n:42, action:'Previous preset'},
  {btn:8,n:43, action:'PLAY'},
  {btn:9,n:44, action:'STOP'},
  {btn:10,n:45, action:'Delay +'},
  {btn:11,n:46, action:'Delay -'},
  {btn:12,n:47, action:'Echo +'},
  {btn:13,n:48, action:'Echo -'},
  {btn:14,n:49, action:'Filter +'},
  {btn:15,n:50, action:'Filter -'},
  {btn:16,n:51, action:'Toggle Data'}
];
const midiButtonMap = {
  36: () => playScaleNote(0),  37: () => playScaleNote(1), 38: () => playScaleNote(2),
  39: () => playScaleNote(3),  40: () => playScaleNote(4),
  41: nextPreset,  42: prevPreset,
  43: play, 44: stop,
  45: () => incSlider('delay', +0.05),   46: () => incSlider('delay', -0.05),
  47: () => incSlider('echo', +0.05),    48: () => incSlider('echo', -0.05),
  49: () => incSlider('filter', +100),   50: () => incSlider('filter', -100),
  51: () => document.getElementById('toggleDisplay').click()
};
let legendHighlightTimers = {};
function highlightLegendByNote(note) {
  const legend = document.getElementById("midiLegend");
  const items = legend.querySelectorAll('.legend-item');
  midiLegendData.forEach((item, idx) => {
    if (item.n === note) {
      items[idx].style.boxShadow = "0 0 0 2px #fff, 0 2px 10px rgba(255,255,255,0.3)";
      items[idx].style.border = "2px solid #fff";
      if (legendHighlightTimers[note]) clearTimeout(legendHighlightTimers[note]);
      legendHighlightTimers[note] = setTimeout(() => {
        items[idx].style.boxShadow = "";
        items[idx].style.border = "1px solid var(--color-border-subtle)";
      }, 220);
    }
  });
}
function handleMidiMessage(e) {
  const [status, note, velocity] = e.data;
  const type = status & 0xf0;
  const channel = status & 0x0f;
  if (!midiInEnabled) return;
  if (type === 0x90 && velocity > 0 && (midiChannel === -1 || channel === midiChannel) && midiButtonMap[note]) {
    midiButtonMap[note]();
    highlightLegendByNote(note);
  }
}
function setupMidi() {
  if (!navigator.requestMIDIAccess) return;
  navigator.requestMIDIAccess().then(midi => {
    midiAccess = midi;
    const outputs = Array.from(midiAccess.outputs.values());
    if (outputs.length > 0) midiOutput = outputs[0];
    midiAccess.inputs.forEach(input => { input.onmidimessage = handleMidiMessage; });
    midiAccess.onstatechange = function(event) {
      if (event.port.type === "input" && event.port.state === "connected") {
        midiAccess.inputs.forEach(input => { input.onmidimessage = handleMidiMessage; });
      }
    };
  });
}
setupMidi();
function sendMidiNote(freq) {
  if (!midiOutput) return;
  let midiNote = Math.round(69 + 12 * Math.log2(freq / 440));
  let velocity = 100;
  let channel = midiChannel === -1 ? 9 : midiChannel;
  midiOutput.send([0x90 + channel, midiNote, velocity]);
  setTimeout(() => {
    midiOutput.send([0x80 + channel, midiNote, 0]);
  }, 400);
}
let audioCtx, analyser, masterGain, delayReverbNode, bufferLength, dataArray;
let bpm = 90, bpmTimer = null, stopped = true;
let trailFrames = [], currentWaveColor = "#00FF7F";
let canvas, ctx;
let secondaryColorHue = 180;

const statusDot = document.getElementById('statusDot');
const playStatus = document.getElementById('playStatus');
const presetSwatch = document.getElementById('presetSwatch');

function setPlayingState(isPlaying) {
  statusDot.classList.toggle('is-playing', isPlaying);
  playStatus.textContent = isPlaying ? 'Playing' : 'Stopped';
  if (canvas) canvas.classList.toggle('is-playing', isPlaying);
}

function updateControlValue(id, value, suffix) {
  const el = document.getElementById(id + 'Value');
  if (el) el.textContent = value + (suffix || '');
}

function updatePresetSwatch(color) {
  if (presetSwatch) presetSwatch.style.background = color;
}

function hueToRgb(h) {
  let rgb = [];
  for (let i = 0; i < 3; i++) {
    let k = (5 - i * 2 + h / 60) % 6;
    rgb[i] = 255 * (1 - Math.max(0, Math.min(1, Math.abs(k) - 1)));
  }
  return `rgb(${rgb.map(v => Math.round(v)).join(',')})`;
}
const presetOrder = ['plants', 'mold', 'bacteria', 'mushrooms', 'harmony'];
const presetSettings = {
  plants:     { scale: [174, 285, 396, 417, 528], color: "#00FF7F" },
  mold:       { scale: [432, 639, 741],           color: "#8A2BE2" },
  bacteria:   { scale: [528, 554, 585, 728],      color: "#FF4500" },
  mushrooms:  { scale: [417, 444, 528, 639],      color: "#FFD700" },
  harmony:    { scale: [432, 528, 639, 741, 852], color: "#00FFFF" }
};
function getScaleFromPreset(val) {
  return presetSettings[val]?.scale || [174, 220, 261];
}
function getColorFromPreset(val) {
  return presetSettings[val]?.color || "#FFFFFF";
}
function playScaleNote(index) {
  if (!audioCtx) return;
  const scale = getScaleFromPreset(document.getElementById('preset').value);
  const freq = scale[index % scale.length];
  if (freq) playTone(freq);
}
function nextPreset() {
  const presetEl = document.getElementById('preset');
  let idx = presetOrder.indexOf(presetEl.value);
  presetEl.value = presetOrder[(idx + 1) % presetOrder.length];
  currentWaveColor = getColorFromPreset(presetEl.value);
  updatePresetSwatch(currentWaveColor);
  if (!stopped) scheduleNotes(getScaleFromPreset(presetEl.value));
}
function prevPreset() {
  const presetEl = document.getElementById('preset');
  let idx = presetOrder.indexOf(presetEl.value);
  presetEl.value = presetOrder[(idx - 1 + presetOrder.length) % presetOrder.length];
  currentWaveColor = getColorFromPreset(presetEl.value);
  updatePresetSwatch(currentWaveColor);
  if (!stopped) scheduleNotes(getScaleFromPreset(presetEl.value));
}
function incSlider(id, delta) {
  const el = document.getElementById(id);
  let min = parseFloat(el.min), max = parseFloat(el.max), step = parseFloat(el.step);
  let value = parseFloat(el.value) + delta;
  value = Math.round(value / step) * step;
  value = Math.max(min, Math.min(max, value));
  el.value = value;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  if (id === 'volume' && masterGain) masterGain.gain.value = parseFloat(el.value) / 100;
  if (id === 'bpm' && !stopped) {
    bpm = Math.round(value);
    scheduleNotes(getScaleFromPreset(document.getElementById('preset').value));
  }
}
function initAudio() {
  if (audioCtx) return;
  canvas = document.getElementById("waveCanvas");
  ctx = canvas.getContext("2d");
  if (!canvas || !ctx) return;
  resizeCanvas();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  masterGain = audioCtx.createGain();
  masterGain.gain.value = parseFloat(volume.value) / 100;
  delayReverbNode = audioCtx.createDelay();
  const reverbFeedback = audioCtx.createGain();
  delayReverbNode.delayTime.value = 0.4;
  reverbFeedback.gain.value = 0.4;
  delayReverbNode.connect(reverbFeedback);
  reverbFeedback.connect(delayReverbNode);
  delayReverbNode.connect(masterGain);
  masterGain.connect(audioCtx.destination);
  animate();
}
function resizeCanvas() {
  canvas = document.getElementById("waveCanvas");
  if (!canvas) return;
  const stage = document.querySelector('.plantasia-stage');
  const stageHeight = stage ? stage.clientHeight : window.innerHeight * 0.58;
  canvas.width = window.innerWidth;
  canvas.height = Math.max(80, stageHeight);
}
window.addEventListener('resize', resizeCanvas);
function playTone(freq) {
  const now = audioCtx.currentTime;
  const filterNode = audioCtx.createBiquadFilter();
  filterNode.type = "lowpass";
  filterNode.frequency.value = parseFloat(filter.value);
  const delayNode = audioCtx.createDelay();
  delayNode.delayTime.value = parseFloat(delay.value);
  const feedbackNode = audioCtx.createGain();
  feedbackNode.gain.value = parseFloat(echo.value);
  const gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(0, now);
  gainNode.gain.linearRampToValueAtTime(0.3, now + 0.3);
  gainNode.gain.linearRampToValueAtTime(0.0, now + 3.0);
  const panNode = audioCtx.createStereoPanner();
  panNode.pan.value = Math.random() * 2 - 1;
  const detuneOffsets = [-0.5, 0, 0.5];
  let oscillators = [];
  detuneOffsets.forEach(offset => {
    const o = audioCtx.createOscillator();
    o.type = "square";
    o.frequency.value = freq * (1 + offset / 100);
    o.connect(gainNode);
    o.start(now);
    o.stop(now + 3.0);
    oscillators.push(o);
  });
  gainNode.connect(panNode);
  panNode.connect(filterNode);
  filterNode.connect(delayNode);
  delayNode.connect(feedbackNode);
  feedbackNode.connect(delayNode);
  delayNode.connect(delayReverbNode);
  gainNode.connect(analyser);

  setTimeout(() => {
    oscillators.forEach(o => o.disconnect());
    gainNode.disconnect();
    panNode.disconnect();
    filterNode.disconnect();
    delayNode.disconnect();
    feedbackNode.disconnect();
  }, 3100);
}
function play() {
  if (!audioCtx) initAudio();
  stopped = false;
  setPlayingState(true);
  clearInterval(bpmTimer);
  const scale = getScaleFromPreset(document.getElementById('preset').value);
  currentWaveColor = getColorFromPreset(document.getElementById('preset').value);
  updatePresetSwatch(currentWaveColor);
  scheduleNotes(scale);
}
function stop() {
  stopped = true;
  setPlayingState(false);
  clearInterval(bpmTimer);
}
function scheduleNotes(scale) {
  clearInterval(bpmTimer);
  bpmTimer = setInterval(() => {
    if (!stopped) {
      const freq = scale[Math.floor(Math.random() * scale.length)];
      playTone(freq);
      sendMidiNote(freq);
    }
  }, 60000 / bpm);
}
function animate() {
  if (!ctx || !analyser) return;
  requestAnimationFrame(animate);
  analyser.getByteTimeDomainData(dataArray);
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (trailFrames.length > 12) trailFrames.shift();
  trailFrames.push([...dataArray]);
  const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
  grad.addColorStop(0, currentWaveColor);
  grad.addColorStop(1, hueToRgb(secondaryColorHue));
  for (let t = 0; t < trailFrames.length; t++) {
    const data = trailFrames[t];
    const slice = canvas.width / data.length;
    ctx.beginPath();
    let x = 0;
    for (let i = 0; i < data.length; i++) {
      const v = (data[i] - 128) / 128.0;
      const y = (v * canvas.height / 2.0 * 0.9) + canvas.height / 2;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
      x += slice;
    }
    const alpha = 0.07 + (t / trailFrames.length) * 0.16;
    ctx.strokeStyle = grad;
    ctx.globalAlpha = alpha;
    ctx.shadowBlur = 15;
    ctx.shadowColor = currentWaveColor;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

function addTouchAndClick(id, fn) {
  let lock = false;
  document.getElementById(id).addEventListener('touchstart', e => {
    if (lock) return;
    lock = true;
    setTimeout(() => { lock = false; }, 300);
    fn(e);
  }, {passive: true});
  document.getElementById(id).addEventListener('click', e => {
    if (lock) return;
    lock = true;
    setTimeout(() => { lock = false; }, 300);
    fn(e);
  });
}
addTouchAndClick('play', play);
addTouchAndClick('stop', stop);

document.getElementById('bpm').addEventListener('input', e => {
  bpm = parseInt(e.target.value);
  updateControlValue('bpm', bpm);
  if (!stopped) scheduleNotes(getScaleFromPreset(preset.value));
});
document.getElementById('preset').addEventListener('change', () => {
  const selected = preset.value;
  currentWaveColor = getColorFromPreset(selected);
  updatePresetSwatch(currentWaveColor);
  if (!stopped) scheduleNotes(getScaleFromPreset(selected));
});
const display = document.getElementById("infoDisplay");
function toggleDisplayPanel() {
  const visible = display.style.display !== "none";
  display.style.display = visible ? "none" : "block";
  document.getElementById('toggleDisplay').setAttribute('aria-pressed', String(!visible));
}
addTouchAndClick("toggleDisplay", toggleDisplayPanel);

let infoDisplayInterval = null;
function updateDisplay() {
  if (display.style.display === "none") return;
  display.textContent =
    "PRESET     : " + document.getElementById("preset").value + "\n" +
    "DELAY      : " + document.getElementById("delay").value + "\n" +
    "ECHO       : " + document.getElementById("echo").value + "\n" +
    "FILTER     : " + document.getElementById("filter").value + "\n" +
    "FREQUENCY  : " + document.getElementById("freq").value + "\n" +
    "VOLUME     : " + document.getElementById("volume").value + "\n" +
    "BPM        : " + document.getElementById("bpm").value +
    "\nMIDI IN    : " + (midiInEnabled ? "ON" : "OFF") +
    "\nMIDI CHAN  : " + (midiChannel === -1 ? 'All' : (Number(midiChannel) + 1));
}
function startInfoDisplayUpdater() {
  if (infoDisplayInterval) clearInterval(infoDisplayInterval);
  infoDisplayInterval = setInterval(updateDisplay, 250);
}
display.style.display = "none";
startInfoDisplayUpdater();

const midiBtn = document.getElementById('toggleMidiIn');
addTouchAndClick('toggleMidiIn', () => {
  midiInEnabled = !midiInEnabled;
  midiBtn.textContent = "MIDI: " + (midiInEnabled ? "On" : "Off");
  midiBtn.setAttribute('aria-pressed', String(midiInEnabled));
});

const midiLegend = document.getElementById("midiLegend");
const toggleLegendBtn = document.getElementById("toggleLegend");
let legendVisible = false;
function showHideLegend() {
  legendVisible = !legendVisible;
  midiLegend.style.display = legendVisible ? "flex" : "none";
  toggleLegendBtn.textContent = legendVisible ? "Hide MIDI" : "MIDI";
  toggleLegendBtn.setAttribute('aria-expanded', String(legendVisible));
}
addTouchAndClick("toggleLegend", showHideLegend);

function renderLegend() {
  midiLegend.innerHTML = "";
  midiLegendData.forEach(item => {
    const d = document.createElement("div");
    d.className = "legend-item";
    d.innerHTML =
      `<span class="legend-label">B${item.btn}</span>` +
      `<span>n${item.n}</span>` +
      `<span>${item.action}</span>`;
    midiLegend.appendChild(d);
  });
}
renderLegend();

const colorSlider = document.getElementById("colorSlider");
colorSlider.addEventListener("input", e => {
  secondaryColorHue = parseInt(e.target.value, 10);
  updateControlValue('color', secondaryColorHue, '\u00B0');
});
colorSlider.addEventListener("touchmove", e => {
  secondaryColorHue = parseInt(e.target.value, 10);
  updateControlValue('color', secondaryColorHue, '\u00B0');
}, {passive:true});

document.getElementById("freq").addEventListener("input", e => {
  updateControlValue('freq', Math.round(parseFloat(e.target.value)));
  if (!audioCtx) initAudio();
  playTone(parseFloat(e.target.value));
});

document.getElementById('delay').addEventListener('input', e => {
  updateControlValue('delay', parseFloat(e.target.value).toFixed(2));
});
document.getElementById('echo').addEventListener('input', e => {
  updateControlValue('echo', parseFloat(e.target.value).toFixed(2));
});
document.getElementById('filter').addEventListener('input', e => {
  updateControlValue('filter', Math.round(parseFloat(e.target.value)));
});
document.getElementById('volume').addEventListener('input', e => {
  updateControlValue('volume', e.target.value);
  if (masterGain) masterGain.gain.value = parseFloat(e.target.value) / 100;
});

const midiChannelSelect = document.getElementById('midiChannelSelect');
midiChannelSelect.value = midiChannel;
midiChannelSelect.addEventListener('change', function() {
  midiChannel = Number(this.value);
  updateDisplay();
});

/* Mobile controls collapse */
const toggleControlsBtn = document.getElementById('toggleControls');
const controlsBody = document.getElementById('controlsBody');
if (toggleControlsBtn && controlsBody) {
  toggleControlsBtn.addEventListener('click', () => {
    const collapsed = controlsBody.classList.toggle('is-collapsed');
    toggleControlsBtn.textContent = collapsed ? 'Show Controls' : 'Hide Controls';
    toggleControlsBtn.setAttribute('aria-expanded', String(!collapsed));
    setTimeout(resizeCanvas, 300);
  });
}

/* Keyboard: Space toggles play/stop when not in a form control */
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  e.preventDefault();
  if (stopped) play(); else stop();
});

/* Initial state */
updatePresetSwatch(getColorFromPreset(document.getElementById('preset').value));
window.addEventListener('load', resizeCanvas);
</script>
</body>
